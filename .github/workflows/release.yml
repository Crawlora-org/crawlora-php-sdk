name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(php -r 'require "src/Operations.php"; require "src/Client.php"; echo Crawlora\Client::VERSION;')"
          expected="$tag"
          if [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]]; then
            expected="${BASH_REMATCH[1]}-sdk.${BASH_REMATCH[2]}"
          fi
          if [ "$expected" != "$version" ]; then
            echo "tag $tag maps to $expected, not Crawlora\\Client::VERSION ($version)" >&2
            exit 1
          fi
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Regenerate and verify
        run: |
          python3 scripts/generate.py
          git diff --exit-code
      - name: Test
        run: vendor/bin/phpunit
      # Packagist auto-imports new tags via its GitHub webhook, so there is no
      # registry push step here — this job only validates and tests the tag.
